[tox]
requires =
    tox>=4
    tox-uv>=1.0.0
env_list = py313,lint
runner = uv-venv-runner

[testenv]
description = Run tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.0.0
    pytest-cov>=4.1.0
commands =
    pytest {posargs}

[testenv:lint]
description = Run linting, formatting checks, and type checking
deps =
    ruff>=0.9.0
    mypy>=1.0
    types-requests
    types-pyyaml
    types-tabulate
commands =
    ruff check .
    ruff format --check .
    mypy

[testenv:fix]
description = Fix linting issues and format code
skip_install = true
deps =
    ruff>=0.9.0
commands =
    ruff check --fix .
    ruff format .
