          in: path
          required: true
          description: Unique identifier of the product to add a version to
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductVersionRequest'

      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVersionResponse'
        '404':
