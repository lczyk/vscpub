  /storage-location:
    get:
      tags:
        - Content Upload
      summary: Get storage location with pre signed folder specs for content upload
      description: |
        Retrieves Google Cloud Storage (GCS) resigned folder location for securely uploading content files to the VCF Solutions Catalog using form data

        **Use Case:**
         It's ideal for applications that need to upload multiple files directly from the client side to a specific folder
        
        **Upload Workflow:**
        1. Call this endpoint to get pre signed folder details
        2. Use the returned policy fields to construct multipart/form-data POST request
        4. After successful upload, reference the uploaded file in your product/version API requests
        5. The policy is temporary and expires after a set duration

        **Example HTML Form Usage:**
        ```
         curl -X POST ${response.URL} \
            -F "key=b850a519-c309-42c9-baa4-4a51bb49ad2b/1771321349/${relace-with-filename-and-ext}" \
            -F "policy=${response.policy}" \
            -F "x-goog-algorithm=${response.x-goog-algorithm}" \
            -F "x-goog-credential=${response.x-goog-credential}" \
            -F "x-goog-date=${response.x-goog-date}" \
            -F "x-goog-signature=${response.x-goog-signature}" \
            -F "file=@path/to/file.ext" 

        ```

      operationId: getStorageLocation
      responses:
        '200':
          description: Storage location with POST policy fields retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStorageLocationResponse'
              example:
                url: "https://storage.googleapis.com/vsc-content-bucket"
                key: "uploads/org-12345/1234543/my-product-v1.0.0.ova"
                policy: "eyJleHBpcmF0aW9uIjoiMjAyNi0wMi0..."
                x-goog-algorithm: "GOOG4-RSA-SHA256"
                x-goog-credential: "service-account@project.iam.gserviceaccount.com/20260216/auto/storage/goog4_request"
                x-goog-date: "20260216T120000Z"
                x-goog-signature: "abcdef123456789..."
        '401':
          description: Unauthorized. The passed access token is invalid or the user doesn't have access to SaaS Console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '403':
          description: Access Denied.User Doesn't have Marketplace User Role (or) User is not part of the org which published this solution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'


components:
  schemas:
    ReleaseTags:
      type: string
      enum:
        - GENERAL_AVAILABILITY
        - DEVELOPER_RELEASE
        - ALPHA_RELEASE
        - BETA_RELEASE
        - RELEASE_CANDIDATE
        - MAJOR_RELEASE
        - MINOR_RELEASE
        - SECURITY_RELEASE
        - MAINTENANCE_RELEASE

    License:
      type: string
      description: Licensing model that governs how end users may access and use the solution. This refers to the solution's own license terms, independent of any VCF platform licensing.
      enum:
        - FREE
        - BYOL
        - TRIAL
        - OPEN_SOURCE
      x-enum-descriptions:
        FREE: The solution is available at no cost. No license key or external license agreement is required to use it.
        BYOL: Bring Your Own License. The publisher provides the solution, but the end user must supply a valid license obtained directly from the publisher or vendor.
        TRIAL: The solution is available for a limited evaluation period. Users can access full or partial functionality before committing to a paid license.
        OPEN_SOURCE: The solution is distributed under an open source license (e.g., MIT, Apache 2.0, GPL). Source code is freely available and usage is governed by the respective open source license terms.

    ProductType:
      type: string
      description: Type of product being published. DISTRIBUTABLE indicates a product with downloadable artifacts (e.g., OVAs, containers, helm charts). LISTING indicates a product that redirects users to an external location without downloadable artifacts.
      enum:
        - DISTRIBUTABLE
        - LISTING

    OS:
      type: string
      description: Operating system types supported by the solution
      enum:
        - DEBIAN
        - I_OS
        - RASPBERRY_PI
        - ANDROID
        - CHROME
        - SUSE
        - RHEL
        - UBUNTU
        - MAC_OS
        - CENT_OS
        - LINUX
        - UNIX
        - WINDOWS

    Category:
      type: string
      description: Solution category classification
      enum:
        - AI_MACHINE_LEARNING
        - ANALYTICS
        - BUSINESS_APPLICATION_SERVICES
        - BUSINESS_TOOLS
        - COMPUTE
        - DATABASES
        - DEVELOPER_TOOLS
        - DEV_OPS
        - HARDWARE
        - IDENTITY
        - INTERNET_OF_THINGS
        - MANAGEMENT_AND_MONITORING
        - NETWORKING
        - OTHER_CATEGORY
        - STORAGE
        - TELCO
        - FINANCIAL_SERVICES

    VcfComponent:
      type: string
      description: VMware Cloud Foundation component compatibility
      enum:
        - NSX
        - OTHER_VCF_COMP
        - VMWARE_LIVE_RECOVERY
        - TELCO_CLOUD
        - VCF_OPERATIONS_FOR_LOGS
        - VCF_OPERATIONS_FOR_NETWORKS
        - VSAN
        - VSPHERE_KUBERNETES_SERVICE
        - VCF_AUTOMATION
        - VCF_OPERATIONS
        - VSPHERE

    ArtifactType:
      type: string
      enum:
        - OVA
        - ISO
        - DOCKER

    HashAlgo:
      type: string
      enum:
        - SHA1
        - SHA256
        - SHA512


    FormFactor:
      type: string
      enum:
        - VIRTUAL_MACHINES
        - CONTAINERS

    Status:
      type: string
      description: Product status in the publishing lifecycle
      enum:
        - PENDING
        - PUBLISHED
        - ARCHIVED
        - DELETED
        - REJECTED
      x-enum-descriptions:
        PENDING: "Product is submitted and awaiting review/approval - Keep checking for status update"
        PUBLISHED: "Product is approved and published in the catalog - No action required"
        ARCHIVED: "Product is archived by Admin and no longer published - Reach out to VSC Admin"
        DELETED: "Product has been deleted from the system by Admin - Reach out to VSC Admin"
        REJECTED: "Product submission was rejected during review - Check review comments or reach out to VSC Admin"


    VersionStatus:
      type: string
      description: Version status in the publishing lifecycle
      enum:
        - VERSION_PENDING
        - ACTIVE
        - REJECTED
      x-enum-descriptions:
