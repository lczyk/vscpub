        - Publishing
      summary: Retrieve product details by product ID
      description: |
        Retrieves comprehensive details of a product from the VCF Solutions Catalog using its unique product identifier.        
        **Use Cases:**
        - View complete product information before creating new versions
        - Check product status and available versions
        - Retrieve product details for updates or modifications

      operationId: GetProduct
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique identifier of the product to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '401':
          description: Unauthorized. The passed access token is invalid or the user doesn't have access to SaaS Console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '403':
          description: Access Denied. User Doesn't have Marketplace User Role (or) User not part of the org which published this solution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

    patch:
      tags:
        - Publishing
      summary: Update product information
      description: |
        Updates product-level information in the VCF Solutions Catalog. This endpoint allows partial updates - only the fields provided in the request will be modified.   
        
        **Use Cases:**
        - Update marketing content or media
        - Modify support contact information
        - Add or update technical specifications
        - Change licensing model
      operationId: UpdateProduct
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique identifier of the product to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '204':
          description: No Content
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '401':
          description: Unauthorized. The passed access token is invalid or the user doesn't have access to SaaS Console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '403':
          description: Access Denied. User Doesn't have Marketplace User Role (or) User not part of the org which published this solution.
          content:
            application/json:
