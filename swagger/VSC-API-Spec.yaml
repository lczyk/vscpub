          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Resource Conflict. Version with the same version number already exists for this product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /products/{productId}/version/{versionNumber}:
    patch:
      tags:
        - Publishing
      summary: Update version details for a product
      description: |
        Updates an existing version of a product in the VCF Solutions Catalog. This endpoint allows partial updates - only the fields provided in the request will be modified.        
        **Asset Update Behavior:**
        - **Virtual Machines (OVA/ISO)**: Replacing assets archives the old ones and requires re-validation
        - **Containers**: New assets replace the existing one

      operationId: UpdateProductVersion
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
        - name: versionNumber
          in: path
          required: true
          description: Version number to update (e.g., "1.0.0")
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductVersionRequest'
      responses:
        '204':
          description: Update Successful. No Content
        '404':
          description: Resource not found. product or version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

        '401':
          description: Unauthorized. The passed access token is invalid or the user doesn't have access to SaaS Console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '403':
          description: Access Denied.User Doesn't have Marketplace User Role (or) User is not part of the org which published this solution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'


    get:
