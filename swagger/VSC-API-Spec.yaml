openapi: 3.0.3
info:
  title: VCF Solutions Catalog API
  description: |
    The VCF Solutions Catalog API enables partners and vendors to publish, manage solutions on Vmware Cloud Foundation (VCF) Solutions Catalog. 
    
    This API provides comprehensive capabilities for:
    - **Authentication**: Secure access using Vmware Cloud Services Console credentials (OAuth client credentials or API Refresh Tokens)
    - **Product Publishing**: Create and manage products with detailed marketing information, technical specifications, and support details
    
    All operations require authentication via the `/auth` endpoint using Vmware Cloud Services Console credentials.
    
    #### Publisher Flow
    
    To publish content to the VCF Solutions Catalog, follow these steps:
    
    1. **Authenticate**: Use the Auth API (`/auth` endpoint) to obtain an access token
        - Provide OAuth client credentials or API refresh token
    
    2. **Verify Permissions**: Ensure the following prerequisites are met:
        - The API token or refresh token must have **Marketplace User Role** assigned
        - The organization must be **enabled for publishing access**
    
    3. **Upload Resources** (if applicable): Use the content upload API to upload any resources or assets
        - Upload product icons, screenshots, documentation, or other media files
        - Save the content location URLs from the upload response
    
    4. **Create/Update Products**: Use the uploaded content locations in product creation or update APIs
        - Reference the uploaded content URLs in product metadata
        - Include all required product information and specifications
  

  version: 1.0.0
  contact:
    name: <to be identified>
servers:
  - url: https://api-devlvn.broadcom.net/vcf/cm/dev/gtw/api/v3
    description: VSC Dev Server
  - url: https://api-devlvn.broadcom.net/vcf/cm/qa/gtw/api/v3
    description: VSC QA Server
  - url: https://eapi-gcpstg.broadcom.com/vcf/vsc/gtw/api/v3
    description: VSC Verify Server
  - url: https://eapi.broadcom.com/vcf/vsc/gtw/api/v3
    description: VSC Prod Server

paths:
  /auth:
    post:
      security: []  # No auth required
      tags:
        - Authentication
      summary: Authenticate and fetch access token
      description: |
        Authenticate to the VCF Solutions Catalog API and obtain a bearer access token for subsequent API requests.
        
        This endpoint supports two authentication methods:
        - **OAuth Client Credentials**: Use client ID and client secret from a Cloud Services OAuth app
        - **API Token**: Use a refresh token generated from  Vmware Cloud Services Console
        
        The returned access token must be included in the Authorization header (as Bearer token) for all other API endpoints.
        
        **Prerequisites:**
        - Active Vmware Cloud Services Console account
        - Marketplace User Role assigned in the organization
        - OAuth app credentials or API token generated from the console

      operationId: authorize
      externalDocs:
        description: How to generate API Token/OAuth App Client Credentials from SaaS Console
        url: https://techdocs.broadcom.com/us/en/vmware-cis/csc/cloud-services-console/saas/using-vmware-cloud-services-console/identity-access-management.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthRequestByClientCredentials'
                - $ref: '#/components/schemas/AuthRequestByAPIToken'

      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'


  /products:
    get:
      tags:
        - Publishing
      summary: List all products in the catalog
      description: |
        Retrieves a list of products from the VCF Solutions Catalog for the signed in Publisher org. Returns summary information for each product accessible to the authenticated user.
        
        **Use Cases:**
        - Browse available products in the catalog for a publisher
        - Get an overview of all products for management purposes

      operationId: listProducts
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of products to return (default 50, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of products to skip for pagination (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '401':
          description: Unauthorized. The passed access token is invalid or the user doesn't have access to SaaS Console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '403':
          description: Access Denied. User doesn't have Marketplace User Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

