[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.9.0"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "pytest", name = "pytest", entry = "tox -e py313", language = "system", pass_filenames = false, always_run = true },
]
