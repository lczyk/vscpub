[project]
name = "vscpub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "mypy>=1.0",
    "types-requests",
    "types-pyyaml",
    "types-tabulate",
]

[project.scripts]
vscpub = "vscpub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=vscpub --cov-report=term-missing"

[tool.coverage.run]
source_pkgs = ["vscpub"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.paths]
vscpub = ["vscpub", ".tox/*/lib/python*/site-packages/vscpub"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["vscpub"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
]
